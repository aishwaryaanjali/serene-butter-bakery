<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game">
    <h1>Tic Tac Toe</h1>
    <p>Choose a mode</p>
    <button onclick="startGame('player')">Play with Player</button>
    <button onclick="startGame('computer')">Play with Computer</button>
    <p id="status">Waiting to start...</p>
    <div id="board" class="board"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
